<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام حضور الطلاب</title>
  <style>
    body { font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; background: #eef2f5; color: #1f2937; margin: 0; padding: 2rem 1rem; }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { margin: 0 0 1rem; }
    .card { background: #fff; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    a { color: #086f7c; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { padding-inline-start: 1.25rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>نظام حضور الطلاب</h1>
    <p>اختر التطبيق:</p>
    <div class="card">
      <h2>تطبيق المعلم (PWA)</h2>
      <p>مسح الباركود، حفظ الجلسة، تصدير ملف الغياب.</p>
      <p><a href="./teacher/">فتح تطبيق المعلم</a></p>
    </div>
    <div class="card">
      <h2>المركز</h2>
      <p>إدارة الطلاب والمعلمين والجداول، استيراد ملفات الغياب، التقارير.</p>
      <p><a href="./center/">فتح المركز</a></p>
    </div>
  </div>
</body>
</html>
